<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-labelledby="t d">
<title id="t">One turn: the loop closes both ways</title>
<desc id="d">A real recorded turn replayed from the emotiv-ecot dataset. Band power flows in at 8 Hz (AF3 theta 7.89 dominant). The ambient line assembles: brain, theta dominant, CQ 13 of 14 good. The agent answers: Solid, 13 of 14 electrodes reading clean. The action is stamped into the EEG record as an amber frame, the post-roll waits for the next metrics sample (they arrive about every 10 seconds), and the REWARD field backfills with the change across the turn boundary. In this turn no sample arrived in time, so the schema writes nan, not zero: absent is not zero. With reduced motion everything is shown at its final state.</desc>
<style>
  .p1,.p2,.p3,.p4,.p5,.p6{opacity:1}
  .win{transform:scaleX(1)}
  @media (prefers-reduced-motion: no-preference){
    .p1{animation:ph1 16s linear infinite}
    .p2{animation:ph2 16s linear infinite}
    .p3{animation:ph3 16s linear infinite}
    .p4{animation:ph4 16s linear infinite}
    .p5{animation:ph5 16s linear infinite}
    .p6{animation:ph6 16s linear infinite}
    .win{animation:wgrow 16s linear infinite;transform-box:fill-box;transform-origin:left center}
    .bar{animation:brise 16s ease-out infinite;transform-box:fill-box;transform-origin:bottom}
  }
  @keyframes brise{0%{transform:scaleY(.05)}8%{transform:scaleY(1)}100%{transform:scaleY(1)}}
  @keyframes ph1{0%{opacity:0}2%{opacity:1}100%{opacity:1}}
  @keyframes ph2{0%{opacity:0}14%{opacity:0}19%{opacity:1}100%{opacity:1}}
  @keyframes ph3{0%{opacity:0}30%{opacity:0}35%{opacity:1}100%{opacity:1}}
  @keyframes ph4{0%{opacity:0}44%{opacity:0}45.5%{opacity:1}100%{opacity:1}}
  @keyframes wgrow{0%{transform:scaleX(0)}46%{transform:scaleX(0)}58.5%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  @keyframes ph5{0%{opacity:0}58.5%{opacity:0}61%{opacity:1}100%{opacity:1}}
  @keyframes ph6{0%{opacity:0}63%{opacity:0}66%{opacity:1}100%{opacity:1}}
</style>
<rect x="1" y="1" width="798" height="298" rx="12" fill="#0b0e14" stroke="#232b36"/>
<text x="20" y="26" font-size="12" fill="#8b949e">one recorded turn · <tspan fill="#c9d1d9">emotiv-ecot</tspan> episode, replayed verbatim</text>

<!-- P1: observation flows in, real AF3 pow values -->
<g class="p1">
<text x="30" y="56" font-size="10" fill="#8b949e">observation.state · 8 Hz · AF3</text>
<g>
<rect class="bar" x="30"  y="80"  width="20" height="70" rx="2" fill="#4ee1c2"/>
<rect class="bar" x="58"  y="124" width="20" height="26" rx="2" fill="#7aa2ff"/>
<rect class="bar" x="86"  y="136" width="20" height="14" rx="2" fill="#ffb454"/>
<rect class="bar" x="114" y="137" width="20" height="13" rx="2" fill="#ff7a7a"/>
<rect class="bar" x="142" y="141" width="20" height="9"  rx="2" fill="#c98bff"/>
</g>
<line x1="26" y1="150" x2="166" y2="150" stroke="#2a323e"/>
<g font-size="10" text-anchor="middle"><text x="40" y="164" fill="#4ee1c2">θ</text><text x="68" y="164" fill="#7aa2ff">α</text><text x="96" y="164" fill="#ffb454">βL</text><text x="124" y="164" fill="#ff7a7a">βH</text><text x="152" y="164" fill="#c98bff">γ</text></g>
<text x="40" y="74" font-size="9" fill="#4ee1c2" text-anchor="middle">7.89</text>
<text x="96" y="180" font-size="9" fill="#586069" text-anchor="middle">θ dominant</text>
</g>

<!-- P2: the ambient line assembles -->
<g class="p2">
<path d="M 172 115 L 205 115" stroke="#2a323e" stroke-width="1.5" fill="none"/>
<rect x="212" y="52" width="380" height="26" rx="13" fill="#101722" stroke="#26547a"/>
<text x="226" y="69" font-size="12" fill="#7aa2ff">[brain: theta dominant · CQ 13/14 good]</text>
<text x="212" y="44" font-size="9" fill="#586069">the one quiet line, shown verbatim</text>
</g>

<!-- P3: the agent answers (real ACT string) -->
<g class="p3">
<text x="226" y="105" font-size="12" fill="#00FF77">▌ Solid: 13 of 14 electrodes reading clean.</text>
<text x="212" y="122" font-size="9" fill="#586069">action = what the agent said</text>
</g>

<!-- frame strip: the LeRobot episode record -->
<text x="212" y="200" font-size="10" fill="#8b949e">the episode, frame by frame (8 Hz)</text>
<g>
<rect x="212" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="232" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="252" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="272" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="292" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="312" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="332" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="352" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="372" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="392" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="412" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="432" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="452" y="208" width="16" height="24" rx="2" fill="#131a26"/><rect x="472" y="208" width="16" height="24" rx="2" fill="#131a26"/>
</g>

<!-- P4: the amber stamp -->
<g class="p4">
<line x1="500" y1="112" x2="500" y2="206" stroke="#ffb454" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="492" y="208" width="16" height="24" rx="2" fill="#ffb454"/>
<text x="500" y="250" font-size="9" fill="#ffb454" text-anchor="middle">action stamped</text>
</g>

<!-- post-roll: waiting for the next met tick -->
<rect class="win" x="512" y="208" width="256" height="24" rx="2" fill="#ffb454" opacity=".12"/>
<g class="p5">
<path d="M 512 204 L 512 198 L 768 198 L 768 204" stroke="#ffb454" stroke-opacity=".6" fill="none"/>
<text x="640" y="192" font-size="9" fill="#ffb454" text-anchor="middle">post-roll · waiting for the next met tick (~10 s cadence)</text>
</g>

<!-- P6: REWARD backfills, honestly -->
<g class="p6">
<text x="512" y="250" font-size="11" fill="#c9d1d9">REWARD: <tspan fill="#ff7a7a">Δstress=nan</tspan></text>
<text x="512" y="266" font-size="9" fill="#586069">no met tick arrived in time. absent ≠ zero, so nan, not 0</text>
</g>

<text x="20" y="284" font-size="10" fill="#586069">brain = observation <tspan fill="#8b949e">and</tspan> reward · the record refuses to fake what it didn't see</text>
</svg>
