<text x="90" y="196" font-size="9" fill="#8b949e" text-anchor="middle">LED on. looks alive.</text>
<g font-size="10">
<text class="l1" x="165" y="92" fill="#8b949e">connectedBy: <tspan fill="#c9d1d9">"usb cable"</tspan></text>
<text class="l2" x="165" y="112" fill="#8b949e">sensors: <tspan fill="#ff7a7a">[]</tspan></text>
<text class="l3" x="165" y="132" fill="#8b949e">createSession → <tspan fill="#ff7a7a">-32152 "not ready"</tspan></text>
</g>
<text x="30" y="226" font-size="11" fill="#ff7a7a">✗ charges only. no data, ever.</text>

