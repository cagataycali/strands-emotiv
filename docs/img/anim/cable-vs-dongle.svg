<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 250" width="800" height="250" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-labelledby="t d">
<title id="t">The cable charges. The dongle carries data.</title>
<desc id="d">Left: EPOC X on the USB cable. The LED is on but queryHeadsets returns connectedBy usb cable with an empty sensors list, and createSession fails with error -32152 not ready. The cable only charges. Right: the USB dongle. Fourteen sensors populate and doctor reports Cortex, headset and streams all green. With reduced motion both final states are shown.</desc>
<style>
  @media (prefers-reduced-motion: no-preference){
    .led{animation:led 8s ease-in-out infinite}
    .l1{animation:t1 8s linear infinite} .l2{animation:t2 8s linear infinite} .l3{animation:t3 8s linear infinite}
    .r1{animation:t4 8s linear infinite} .r2{animation:t5 8s linear infinite}
    .s0{animation:pop0 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop0{0%,50%{opacity:.15;transform:scale(.4)}52%,100%{opacity:1;transform:scale(1)}}
.s1{animation:pop1 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop1{0%,52%{opacity:.15;transform:scale(.4)}54%,100%{opacity:1;transform:scale(1)}}
.s2{animation:pop2 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop2{0%,54%{opacity:.15;transform:scale(.4)}56%,100%{opacity:1;transform:scale(1)}}
.s3{animation:pop3 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop3{0%,56%{opacity:.15;transform:scale(.4)}58%,100%{opacity:1;transform:scale(1)}}
.s4{animation:pop4 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop4{0%,58%{opacity:.15;transform:scale(.4)}60%,100%{opacity:1;transform:scale(1)}}
.s5{animation:pop5 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop5{0%,60%{opacity:.15;transform:scale(.4)}62%,100%{opacity:1;transform:scale(1)}}
.s6{animation:pop6 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop6{0%,62%{opacity:.15;transform:scale(.4)}64%,100%{opacity:1;transform:scale(1)}}
.s7{animation:pop7 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop7{0%,64%{opacity:.15;transform:scale(.4)}66%,100%{opacity:1;transform:scale(1)}}
.s8{animation:pop8 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop8{0%,66%{opacity:.15;transform:scale(.4)}68%,100%{opacity:1;transform:scale(1)}}
.s9{animation:pop9 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop9{0%,68%{opacity:.15;transform:scale(.4)}70%,100%{opacity:1;transform:scale(1)}}
.s10{animation:pop10 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop10{0%,70%{opacity:.15;transform:scale(.4)}72%,100%{opacity:1;transform:scale(1)}}
.s11{animation:pop11 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop11{0%,72%{opacity:.15;transform:scale(.4)}74%,100%{opacity:1;transform:scale(1)}}
.s12{animation:pop12 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop12{0%,74%{opacity:.15;transform:scale(.4)}76%,100%{opacity:1;transform:scale(1)}}
.s13{animation:pop13 8s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes pop13{0%,76%{opacity:.15;transform:scale(.4)}78%,100%{opacity:1;transform:scale(1)}}
  }
  @keyframes led{0%,100%{opacity:.4}10%,30%{opacity:1}}
  @keyframes t1{0%,8%{opacity:0}12%,100%{opacity:1}}
  @keyframes t2{0%,18%{opacity:0}22%,100%{opacity:1}}
  @keyframes t3{0%,30%{opacity:0}34%,100%{opacity:1}}
  @keyframes t4{0%,48%{opacity:0}52%,100%{opacity:1}}
  @keyframes t5{0%,80%{opacity:0}84%,100%{opacity:1}}
</style>
<rect x="1" y="1" width="798" height="248" rx="12" fill="#0b0e14" stroke="#232b36"/>
<line x1="400" y1="16" x2="400" y2="234" stroke="#1d2430"/>

