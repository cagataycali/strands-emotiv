<circle class="s13" cx="501.0" cy="87.0" r="5" fill="#4ee1c2"/>
<text x="490" y="196" font-size="9" fill="#8b949e" text-anchor="middle">14 sensors populate</text>
<g font-size="10">
<text class="r1" x="565" y="92" fill="#8b949e">connectedBy: <tspan fill="#c9d1d9">"dongle"</tspan></text>
<text class="r1" x="565" y="112" fill="#8b949e">sensors: <tspan fill="#4ee1c2">14</tspan></text>
<text class="r2" x="565" y="132" fill="#8b949e">doctor: <tspan fill="#4ee1c2">Cortex ✓ headset ✓ streams ✓</tspan></text>
</g>
<text x="430" y="226" font-size="11" fill="#4ee1c2">✓ data flows. plug this one in.</text>
</svg>