<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-labelledby="t d">
<title id="t">Three speeds, never mixed</title>
<desc id="d">Replay of 10.53 seconds of real EPOC X signal. Reflex lane: blinks at 0.03 s, a blink burst at 1.78 s, a left wink held at 5.25 s. Ambient lane: one quiet line emitted at the 9.96 s metrics tick: eng 0.79, int 0.51, str 0.39. Intent lane: opt-in only, never fires in this replay. With reduced motion, all events are shown at their final positions.</desc>
<style>
  .ev{opacity:.8}
  .late{opacity:1}
  .ph{opacity:.9}
  @media (prefers-reduced-motion: no-preference){
    .ph{animation:sweep 12s linear infinite}
    .e1{animation:f1 12s linear infinite}
    .e2{animation:f2 12s linear infinite}
    .e3{animation:f3 12s linear infinite}
    .fill{animation:grow 12s linear infinite;transform-box:fill-box;transform-origin:left center}
    .late{animation:pop 12s linear infinite}
    .l2{animation:pop2 12s linear infinite}
  }
  @media (prefers-reduced-motion: reduce){
    .ph{display:none}
  }
  @keyframes sweep{0%{transform:translateX(0)}87.7%{transform:translateX(630px)}100%{transform:translateX(630px)}}
  @keyframes grow{0%{transform:scaleX(0)}83%{transform:scaleX(1)}100%{transform:scaleX(1)}}
  @keyframes f1{0%{opacity:.12}0.2%{opacity:.12}0.6%{opacity:1}3%{opacity:.8}100%{opacity:.8}}
  @keyframes f2{0%{opacity:.12}14.6%{opacity:.12}15.2%{opacity:1}18%{opacity:.8}100%{opacity:.8}}
  @keyframes f3{0%{opacity:.12}43.5%{opacity:.12}44.1%{opacity:1}47%{opacity:.8}100%{opacity:.8}}
  @keyframes pop{0%{opacity:0}82.8%{opacity:0}84.5%{opacity:1}100%{opacity:1}}
  @keyframes pop2{0%{opacity:0}85%{opacity:0}87%{opacity:1}100%{opacity:1}}
</style>
<rect x="1" y="1" width="798" height="228" rx="12" fill="#0b0e14" stroke="#232b36"/>
<text x="20" y="26" font-size="12" fill="#8b949e">replaying <tspan fill="#c9d1d9">10.53 s of real EPOC X signal</tspan> · strands_emotiv/fixtures/epocx_live_10s.jsonl</text>

<!-- time axis -->
<g stroke="#2a323e"><line x1="150" y1="200" x2="780" y2="200"/>
<line x1="150" y1="196" x2="150" y2="204"/><line x1="449.2" y1="196" x2="449.2" y2="204"/><line x1="748.3" y1="196" x2="748.3" y2="204"/></g>
<g font-size="10" fill="#8b949e"><text x="150" y="216" text-anchor="middle">0 s</text><text x="449" y="216" text-anchor="middle">5 s</text><text x="748" y="216" text-anchor="middle">10 s</text></g>

<!-- lane labels -->
<g font-size="11">
<text x="20" y="66" fill="#c98bff">REFLEX</text><text x="20" y="79" font-size="9" fill="#8b949e">≤100 ms</text>
<text x="20" y="126" fill="#7aa2ff">AMBIENT</text><text x="20" y="139" font-size="9" fill="#8b949e">~10 s</text>
<text x="20" y="176" fill="#00FF77">INTENT</text><text x="20" y="189" font-size="9" fill="#8b949e">opt-in</text>
</g>

<!-- REFLEX lane: real blink events -->
<line x1="150" y1="62" x2="780" y2="62" stroke="#1d2430"/>
<g class="ev e1"><line x1="151.8" y1="50" x2="151.8" y2="74" stroke="#c98bff" stroke-width="2"/><text x="151.8" y="44" font-size="9" fill="#c98bff" text-anchor="middle">blink</text></g>
<g class="ev e2"><line x1="256.5" y1="50" x2="256.5" y2="74" stroke="#c98bff" stroke-width="2"/><line x1="260.1" y1="52" x2="260.1" y2="72" stroke="#c98bff" stroke-width="2"/><line x1="263.7" y1="52" x2="263.7" y2="72" stroke="#c98bff" stroke-width="2"/><text x="260" y="44" font-size="9" fill="#c98bff" text-anchor="middle">blink burst</text></g>
<g class="ev e3"><rect x="464.1" y="54" width="18.5" height="16" rx="3" fill="#c98bff" opacity=".85"/><text x="473" y="44" font-size="9" fill="#c98bff" text-anchor="middle">winkL held</text></g>
<text x="770" y="79" font-size="9" fill="#586069" text-anchor="end">clench = veto, same lane</text>

<!-- AMBIENT lane: 10 s integration then ONE line -->
<line x1="150" y1="122" x2="780" y2="122" stroke="#1d2430"/>
<rect class="fill" x="150" y="119" width="595.9" height="6" rx="3" fill="#7aa2ff" opacity=".35"/>
<g class="late"><circle cx="745.9" cy="122" r="5" fill="#7aa2ff"/><text x="745.9" y="106" font-size="9" fill="#7aa2ff" text-anchor="middle">met tick · 9.96 s</text></g>
<text class="l2" x="780" y="146" font-size="11" fill="#c9d1d9" text-anchor="end">[brain: <tspan fill="#7aa2ff">eng 0.79</tspan> · int 0.51 · str 0.39 · CQ 14/14]</text>

<!-- INTENT lane: dormant on purpose -->
<line x1="150" y1="172" x2="780" y2="172" stroke="#00FF77" stroke-opacity=".22" stroke-dasharray="4 6"/>
<text x="780" y="189" font-size="9" fill="#586069" text-anchor="end">one trained “yes” · never fires in this replay: that is the point</text>

<!-- playhead -->
<g class="ph"><line x1="150" y1="36" x2="150" y2="200" stroke="#e6edf3" stroke-opacity=".5" stroke-width="1"/></g>
</svg>
