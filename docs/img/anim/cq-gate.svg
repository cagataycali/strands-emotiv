<text x="310" y="150" font-size="10" fill="#8b949e">electrodes reading clean</text>
<rect x="310" y="158" width="400" height="8" rx="4" fill="#131a26"/>
<rect class="bar" x="310" y="158" width="400" height="8" rx="4" fill="#4ee1c2" opacity=".55"/>
<line x1="595.7" y1="152" x2="595.7" y2="172" stroke="#ffb454"/>
<text x="595.7" y="184" font-size="9" fill="#ffb454" text-anchor="middle">gate 10/14</text>
<text x="310" y="216" font-size="10" fill="#586069">absent ≠ zero. missing data changes what the agent says, it never becomes a fake 0.</text>
</g>
