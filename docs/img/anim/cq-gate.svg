<text x="310" y="110" font-size="10" fill="#8b949e">T7 dry. the line changed, the talk continues.</text>
</g>
<g class="cC" opacity="0">
<rect x="310" y="66" width="400" height="26" rx="13" fill="#160f12" stroke="#7a2f3a"/>
<text x="324" y="83" font-size="12" fill="#ff7a7a">"I can't see your brain right now"</text>
<text x="310" y="110" font-size="10" fill="#8b949e">CQ 8/14, below the gate. the agent says so instead of guessing.</text>
</g>
