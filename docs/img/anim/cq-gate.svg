<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="800" height="240" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" role="img" aria-labelledby="t d">
<title id="t">Absent is not zero: contact quality gates everything</title>
<desc id="d">A 14 electrode head map fed by the dev stream at 2 Hz. All 14 read clean and the ambient line says CQ 14 of 14. T7 dries (a simulated dropout, the recorded baseline is all green): the line changes to CQ 13 of 14 and the agent keeps talking. Five more dry, 8 of 14 crosses below the 10 of 14 gate, and the line is replaced by the refusal: I can't see your brain right now. Missing data changes what the agent says. It never becomes a fake zero. With reduced motion, three small heads show the three states side by side.</desc>
<style>
  @media (prefers-reduced-motion: no-preference){
    .aT7{animation:t7f 14s linear infinite}
    .aF7{animation:d1 14s linear infinite} .aFC5{animation:d2 14s linear infinite}
    .aP7{animation:d3 14s linear infinite} .aT8{animation:d4 14s linear infinite}
    .aO1{animation:d5 14s linear infinite}
    .cA{animation:kA 14s linear infinite} .cB{animation:kB 14s linear infinite} .cC{animation:kC 14s linear infinite}
    .bar{animation:kbar 14s linear infinite;transform-box:fill-box;transform-origin:left center}
    .orbs{animation:pulse 3s ease-in-out infinite}
  }
  @media (prefers-reduced-motion: reduce){
    .anim-scene{display:none !important}
    .rm-only{display:inline !important}
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.82}}
  @keyframes t7f{0%,28%{fill:#4ee1c2}33%{fill:#ffb454}38%,100%{fill:#30363d}}
  @keyframes d1{0%,57%{fill:#4ee1c2}60%,100%{fill:#30363d}}
  @keyframes d2{0%,59%{fill:#4ee1c2}62%,100%{fill:#30363d}}
  @keyframes d3{0%,61%{fill:#4ee1c2}64%,100%{fill:#30363d}}
  @keyframes d4{0%,63%{fill:#4ee1c2}66%,100%{fill:#30363d}}
  @keyframes d5{0%,65%{fill:#4ee1c2}68%,100%{fill:#30363d}}
  @keyframes kA{0%,30%{opacity:1}33%,100%{opacity:0}}
  @keyframes kB{0%,31%{opacity:0}34%,58%{opacity:1}61%,100%{opacity:0}}
  @keyframes kC{0%,59%{opacity:0}62%,100%{opacity:1}}
  @keyframes kbar{0%,28%{transform:scaleX(1)}33%,57%{transform:scaleX(.929)}68%,100%{transform:scaleX(.571)}}
</style>
