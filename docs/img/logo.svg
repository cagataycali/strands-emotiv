<svg width="290" height="463" viewBox="0 0 290 463" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">strands-emotiv</title>
  <desc id="d">Two interlocked strands. The green one is the agent (Strands). The teal one is a human, and an EEG signal travels along it, electrodes pulse with contact, and where the strands cross the agent reads the brain.</desc>

  <defs>
    <!-- the human strand: dashboard teal → blue, like band power on the scalp -->
    <linearGradient id="human" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#4ee1c2"/>
      <stop offset="55%"  stop-color="#7aa2ff"/>
      <stop offset="100%" stop-color="#4ee1c2"/>
    </linearGradient>
    <!-- the agent strand: Strands green, kept -->
    <linearGradient id="agent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00FF77"/>
      <stop offset="100%" stop-color="#00d966"/>
    </linearGradient>
    <!-- the reading: where the agent meets the brain -->
    <radialGradient id="reading" cx="50%" cy="50%">
      <stop offset="0%"   stop-color="#dbe4ee" stop-opacity="0.85"/>
      <stop offset="40%"  stop-color="#4ee1c2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ee1c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- the strand's centerline: the wire the signal rides -->
    <path id="wire" d="M 84 74 C 150 96, 232 122, 242 160 C 250 200, 190 232, 132 260 C 82 284, 40 300, 52 322 C 62 342, 130 362, 204 386"/>
    <clipPath id="humanClip">
      <path d="M97.2902 52.7884C85.0674 49.1667 72.2234 56.1389 68.6017 68.3616C64.9801 80.5843 71.9524 93.4283 84.1749 97.0501L235.117 139.775C245.223 142.769 246.357 156.628 236.874 161.226L32.546 260.291C-14.9439 283.316 -9.16107 352.74 41.4835 367.591L189.551 411.009L190.125 411.169C202.183 414.376 214.665 407.396 218.196 395.355C221.784 383.122 214.774 370.296 202.541 366.709L54.4738 323.291C44.3447 320.321 43.1879 306.436 52.6857 301.831L257.014 202.766C304.432 179.776 298.758 110.483 248.233 95.512L97.2902 52.7884Z"/>
    </clipPath>
  </defs>

  <style>
    /* signal packets travelling along the human strand (the wire) */
    .eeg { stroke: #dbe4ee; stroke-width: 3; stroke-linecap: round; fill: none; opacity: .95;
           stroke-dasharray: 2 14 6 10 3 22 9 12 2 30;
           animation: travel 6s linear infinite; }
    .eeg.b { stroke: #4ee1c2; stroke-width: 6; opacity: .35; stroke-dasharray: 4 60 12 44;
             animation-duration: 9s; animation-direction: reverse; }
    @keyframes travel { to { stroke-dashoffset: -460; } }

    /* electrodes: contact-quality orbs, breathing out of phase */
    .el { fill: #4ee1c2; filter: url(#glow); transform-box: fill-box; transform-origin: center;
          animation: pulse 2.4s ease-in-out infinite; }
    .el:nth-of-type(2) { animation-delay: -.4s } .el:nth-of-type(3) { animation-delay: -.9s }
    .el:nth-of-type(4) { animation-delay: -1.3s } .el:nth-of-type(5) { animation-delay: -1.8s }
    .el:nth-of-type(6) { animation-delay: -2.1s }
    @keyframes pulse { 0%,100% { transform: scale(.85); opacity: .75 } 50% { transform: scale(1.25); opacity: 1 } }

    /* the reading: the agent glances at the brain every ~10 s (met cadence, compressed) */
    .reading { transform-box: fill-box; transform-origin: center; animation: read 5s ease-in-out infinite; }
    @keyframes read { 0%,70%,100% { opacity: 0; transform: scale(.6) } 78% { opacity: 1; transform: scale(1.15) } 90% { opacity: .6; transform: scale(1) } }

    /* the agent breathes, barely */
    .agent { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { opacity: .92 } 50% { opacity: 1 } }

    /* a marker: injectMarker stamps the record right after the reading */
    .marker { stroke: #ffb454; stroke-width: 2.5; stroke-linecap: round; opacity: 0;
              animation: stamp 5s ease-out infinite; }
    @keyframes stamp { 0%,84%,100% { opacity: 0 } 86% { opacity: 1 } 96% { opacity: 0 } }

    @media (prefers-reduced-motion: reduce) {
      .eeg, .el, .reading, .agent, .marker { animation: none !important; }
      .reading { opacity: .5 } .eeg { stroke-dasharray: none; opacity: .5 } .marker { opacity: .8 }
    }
  </style>

  <!-- ===== THE HUMAN STRAND (was grey) ===== -->
  <path d="M97.2902 52.7884C85.0674 49.1667 72.2234 56.1389 68.6017 68.3616C64.9801 80.5843 71.9524 93.4283 84.1749 97.0501L235.117 139.775C245.223 142.769 246.357 156.628 236.874 161.226L32.546 260.291C-14.9439 283.316 -9.16107 352.74 41.4835 367.591L189.551 411.009L190.125 411.169C202.183 414.376 214.665 407.396 218.196 395.355C221.784 383.122 214.774 370.296 202.541 366.709L54.4738 323.291C44.3447 320.321 43.1879 306.436 52.6857 301.831L257.014 202.766C304.432 179.776 298.758 110.483 248.233 95.512L97.2902 52.7884Z"
        fill="url(#human)" opacity="0.28"/>
  <!-- the signal, clipped to the ribbon so it lives inside the strand -->
  <g clip-path="url(#humanClip)">
    <use href="#wire" class="eeg b"/>
    <use href="#wire" class="eeg"/>
  </g>
  <!-- electrodes along the wire, 10-20-ish spacing -->
  <g>
    <circle class="el" cx="84"  cy="74"  r="6"/>
    <circle class="el" cx="242" cy="160" r="5"/>
    <circle class="el" cx="132" cy="260" r="5"/>
    <circle class="el" cx="52"  cy="322" r="6"/>
    <circle class="el" cx="204" cy="386" r="6"/>
    <circle class="el" cx="170" cy="118" r="4"/>
  </g>

  <!-- ===== THE READING: where the agent crosses the brain ===== -->
  <circle class="reading" cx="145" cy="231" r="34" fill="url(#reading)" filter="url(#soft)"/>
  <!-- marker tick, stamped on the record just after -->
  <path class="marker" d="M 145 200 L 145 262"/>

  <!-- ===== THE AGENT STRAND (Strands green, unchanged geometry) ===== -->
  <path class="agent" d="M259.147 0.981812C271.389 -2.57498 284.197 4.46571 287.754 16.7074C291.311 28.9492 284.27 41.757 272.028 45.3138L71.1727 103.671C40.7142 112.521 37.1976 154.262 65.7459 168.083L241.343 253.093C307.872 285.302 299.794 382.546 228.862 403.336L30.4041 461.502C18.1707 465.088 5.34708 458.078 1.76153 445.844C-1.8239 433.611 5.18637 420.787 17.4197 417.202L215.878 359.035C246.277 350.125 249.739 308.449 221.226 294.645L45.6297 209.635C-20.9834 177.386 -12.7772 79.9893 58.2928 59.3402L259.147 0.981812Z"
        fill="url(#agent)"/>
</svg>
